# Defaults
set -ga terminal-overrides ",*:RGB"
set -g default-terminal "tmux-256color"
set -g base-index 1
set -g pane-base-index 1
set -g renumber-windows on
set -g mouse on
set -g set-clipboard on
set -g allow-passthrough on
set -g extended-keys on
set -g history-limit 50000
set -g focus-events on
set -g escape-time 0
set -g detach-on-destroy off

# Leader
unbind C-b
set -g prefix C-Space
bind-key C-Space send-prefix

# Panes
unbind %
bind | split-window -h -c "#{pane_current_path}"
unbind '"'
bind - split-window -v -c "#{pane_current_path}"
bind c new-window -c "#{pane_current_path}"

# Resize panes (repeatable)
bind -r H resize-pane -L 5
bind -r J resize-pane -D 5
bind -r K resize-pane -U 5
bind -r L resize-pane -R 5

# Reload
unbind r
bind r source-file $HOME/.config/tmux/tmux.conf

# Smart pane navigation (vim-aware)
is_vim="ps -o state= -o comm= -t '#{pane_tty}' | grep -iqE '^[^TXZ ]+ +(\\S+\\/)?g?(view|n?vim?x?)(diff)?$'"
bind-key -n C-h if-shell "$is_vim" "send-keys C-h" "select-pane -L"
bind-key -n C-j if-shell "$is_vim" "send-keys C-j" "select-pane -D"
bind-key -n C-k if-shell "$is_vim" "send-keys C-k" "select-pane -U"
bind-key -n C-l if-shell "$is_vim" "send-keys C-l" "select-pane -R"

# Window navigation (no prefix)
bind -n M-1 select-window -t 1
bind -n M-2 select-window -t 2
bind -n M-3 select-window -t 3
bind -n M-4 select-window -t 4
bind -n M-5 select-window -t 5
bind -n M-6 select-window -t 6
bind -n M-7 select-window -t 7
bind -n M-8 select-window -t 8
bind -n M-9 select-window -t 9
bind -n C-S-h previous-window
bind -n C-S-l next-window

# Session navigation (no prefix)
bind -n C-, switch-client -p
bind -n C-. switch-client -n

# Copy mode (vi)
set-window-option -g mode-keys vi
unbind -T copy-mode-vi MouseDragEnd1Pane
bind-key -T copy-mode-vi v send-keys -X begin-selection
bind-key -T copy-mode-vi C-v send-keys -X rectangle-toggle
bind-key -T copy-mode-vi y send-keys -X copy-pipe-and-cancel "sed -E -e 's/^[[:space:]]*(│|┃|║)[[:space:]]*//' -e 's/[[:space:]]*(│|┃|║)[[:space:]]*$//' -e 's/[[:space:]]*$//' | pbcopy"
bind-key -T copy-mode-vi Y send-keys -X copy-pipe-and-cancel "~/.config/tmux/dewrap.sh | pbcopy"

# Sesh (session manager)
bind-key x kill-pane
bind-key N command-prompt -p "New session name:" "new-session -s '%%'"

# ── Session picker (sesh) ─────────────────────────────────
bind-key Space display-popup -E -w 60% -h 60% "~/.config/tmux/scripts/sesh-picker.sh"
bind-key s     display-popup -E -w 60% -h 60% "~/.config/tmux/scripts/sesh-picker.sh"
bind-key -n M-o run-shell "sesh last"

# Theming
set -g status-position top
set -g status-style 'bg=default,fg=white'
set -g status-left '#[fg=brightwhite,bold] #S  '
set -g status-left-length 30
set -g status-right '#(tmux list-sessions -F "##S" | while read s; do if [ "$s" = "#S" ]; then printf "#[fg=green,bold] $s  #[fg=gray,nobold]"; else printf " $s  "; fi; done)'
set -g status-right-length 100
set -g window-status-format '#[fg=gray] #I:#W '
set -g window-status-current-format '#[fg=green,bold] #I:#W '
set -g window-status-separator ''
set -g pane-border-style 'fg=#3b4252'
set -g pane-active-border-style 'fg=#6f8788'

# Plugins
set-environment -g TMUX_PLUGIN_MANAGER_PATH "$HOME/.tmux/plugins"
set -g @plugin 'tmux-plugins/tpm'
set -g @plugin 'tmux-plugins/tmux-sensible'

# Initialize TPM (must be at the bottom)
run '~/.tmux/plugins/tpm/tpm'
