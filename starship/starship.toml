"$schema" = 'https://starship.rs/config-schema.json'

format = """
$directory\
$git_branch\
$git_state\
$git_status\
$character"""

right_format = """
"""

add_newline = false

[directory.substitutions]
"Development" = "󰲋 "
"Documents" = "󰈙 "
"Downloads" = " "
"Music" = "󰝚 "
"Pictures" = " "
"dotfiles" = ""
"ef/" = "/"

[hostname]
ssh_only = false
style = 'fg:blue'
format = '[@$hostname]($style) '

[directory]
style = "fg:orange"
read_only_style = "fg:orange"
truncation_length = 0
format = "[$path]($style)[$read_only]($read_only_style) "

[git_branch]
style = "fg:green"
symbol = " "
format = "[$symbol$branch(:$remote_branch)]($style) "

[character]
success_symbol = '[](bold green)'
error_symbol = '[](bold red)'
